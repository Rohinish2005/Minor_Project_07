[project]
name = "pcap-ai-parser"
version = "0.1.0"
description = "AI-powered PCAP analysis pipeline using dpkt and tshark for bulk packet processing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "dpkt>=1.9.8",
    "pyshark>=0.6",
    "scapy>=2.6",
    "pandas>=2.2",
    "rich>=13.7",
    "click>=8.1",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "loguru>=0.7",
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "reportlab>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipython>=8.24",
]

[project.scripts]
pcap-parse = "pcap_ai_parser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcap_ai_parser"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
